// Raycaster for walking
const raycaster = new THREE.Raycaster();
const downwardVector = new THREE.Vector3(0, -1, 0);
let walkSpeed = 5;
let currentGroundMesh = null; // Platform player is standing on
let playerSpeedAccumulator = 0;

// Procedural Assets Storage
const textures = {};

// === TEXTURE GENERATION (Canvas-based) ===
function createNoiseTexture(type = 'noise') {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    
    if (type === 'bark') {
        ctx.fillStyle = '#3e2723';
        ctx.fillRect(0,0,size,size);
        
        // Vertical lines and noise
        for(let i=0; i<3000; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const w = Math.random() * 5 + 1;
            const h = Math.random() * 20 + 5;
            
            ctx.fillStyle = Math.random() > 0.5 ? '#5d4037' : '#1b100e';
            if(Math.random()>0.8) ctx.fillStyle = '#2f1c16'; // Knots
            
            ctx.fillRect(x, y, w, h);
        }
    } else if (type === 'wood') {
        ctx.fillStyle = '#8d6e63';
        ctx.fillRect(0,0,size,size);
        
        // Grain
        for(let i=0; i<50; i++) {
            const y = Math.random() * size;
            const w = Math.random() * 20 + 10;
            const h = Math.random() * 4 + 2;
            ctx.fillStyle = Math.random()>0.5 ? '#a1887f' : '#6d4c41';
            ctx.fillRect(0, y, size, h);
        }
        // Knots
        for(let i=0; i<20; i++) {
            ctx.fillStyle = '#3e2723';
            const r = Math.random() * 5 + 2;
            ctx.beginPath();
            ctx.arc(Math.random()*size, Math.random()*size, r, 0, Math.PI*2);
            ctx.fill();
        }
    } else if (type === 'leaves') {
        const palette = CONFIG.season === 'autumn' 
            ? ['#d35400', '#f39c12', '#e67e22', '#d4af37'] 
            : CONFIG.season === 'winter'
                ? ['#ffffff', '#ecf0f1', '#bdc3c7']
                : ['#2ecc71', '#27ae60', '#1e8449', '#229954'];
        
        ctx.fillStyle = palette[Math.floor(Math.random()*palette.length)];
        ctx.fillRect(0,0,size,size);

        // Add variegation
        for(let i=0; i<2000; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            const color = palette[Math.floor(Math.random()*palette.length)];
            ctx.fillStyle = color;
            
            // Leaf shape blob
            ctx.beginPath();
            ctx.ellipse(x, y, Math.random()*10+5, Math.random()*10+3, Math.random(), 0, Math.PI*2);
            ctx.fill();
        }
    } else if (type === 'grass') {
        ctx.fillStyle = '#4caf50'; // Base
        ctx.fillRect(0,0,size,size);
        
        // Grass blades
        for(let i=0; i<2000; i++) {
            const x = Math.random() * size;
            const y = Math.random() * size;
            ctx.fillStyle = ['#388e3c', '#43a047', '#558b2f'][Math.floor(Math.random()*3)];
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + (Math.random()-0.5)*3, y - 10);
            ctx.lineTo(x - (Math.random()-0.5)*3, y - 10);
            ctx.fill();
        }
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function makeShaderTexture() {
    // Simple noise shader for procedural generation if needed, 
    // but canvas textures are fast enough for this scope.
}

// Initialize Textures
textures.bark = createNoiseTexture('bark');
textures.wood = createNoiseTexture('wood');
textures.leavesSpring = createNoiseTexture('leaves');
textures.leavesSummer = createNoiseTexture('leaves');
textures.leavesAutumn = createNoiseTexture('leaves');
textures.leavesWinter = createNoiseTexture('leaves');
textures.grass = createNoiseTexture('grass');

// Materials
const matBark = new THREE.MeshStandardMaterial({ 
    map: textures.bark, roughness: 0.9, bumpScale: 0.5, color: 0xffffff }); 

const matWood = new THREE.MeshStandardMaterial({
    map: textures.wood, roughness: 0.8, color: 0x795548 
});

// Season Materials
function getLeavesMaterial() {
    return new THREE.MeshLambertMaterial({
        map: textures[`leaves${CONFIG.season.charAt(0).toUpperCase() + CONFIG.season.slice(1)}`],
        color: CONFIG.season === 'winter' ? 0xffffff : 0x3e2723 // Darken if winter snow? Or white out. Let's go dark base for contrast.
    });
}

// ===== GENERATORS =====

// Helper to group meshes into a custom type
const THREE_TYPES = {
    TREETRUNK: 'TREETRUNK',
    LEAVES: 'LEAVES',
    BRANCH: 'BRANCH',
    PLATFORM: 'PLATFORM',
    WALL: 'WALL',
    ROOF: 'ROOF',
    BRIDGE: 'BRIDGE'
};

// --- TREETOP VILLAGE GENERATOR ---
const trees = []; // Array of tree objects { mesh, platformPositions, topPosition }
const dwellings = [];
const villagers = [];

function clearScene() {
    while(scene.children.length > 0){ 
        scene.remove(scene.children[0]); 
    }
    
    // Clear arrays but keep lights/camera logic if needed
    
    // Re-add basic lights? No, let's rebuild the whole lighting system for simplicity in a reset.
}

function reseed() {
    clearScene();
    CONFIG.seed = Math.floor(Math.random() * 9999);
    document.getElementById('seed-val').value = CONFIG.seed;
    
    // Generate Trees
    generateTrees();
    generateGround();
    generateVillage();
}

function createSimpleInstancedMesh(geometry, material) {
    const mesh = new THREE.InstancedMesh(geometry, material, 100);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
}

function generateTrees() {
    const treeGroup = new THREE.Group();
    
    // Use InstancedMesh for trunks and foliage for performance
    // But to allow individual movement (sway), we need separate groups per tree or complex shaders.
    // For 7 trees, standard group meshing is fine. For thousands of leaves, instancing.

    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.9 });
    const leafMatSpring = getLeavesMaterial();
    
    // Base random seed effect on tree positions
    const startPoss = [
        {x: -20, z: -15}, {x: -40, z: 30}, {x: 35, z: -25}, 
        {x: 30, z: 20}, {x: -60, z: -50}, {x: 30, z: -50},
        {x: -10, z: 45} // Central tall tree
    ];
    
    for(let i=0; i<startPoss.length; i++) {
        const pos = startPoss[i];
        const treeHeight = 10 + Math.random() * 20;
        
        // Trunk (Cylinder with slight radius variance)
        const trunkGeo = new THREE.CylinderGeometry(2, 4, treeHeight, 7);
        trunkGeo.translate(0, treeHeight/2, 0);
        trunkGeo.rotateX(0.1); // Slight tilt

        const trunk = new THREE.Mesh(trunkGeo, matBark);
        trunk.position.set(pos.x + (Math.random()-0.5)*5, pos.y || 0, pos.z + (Math.random()-0.5)*5);
        trunk.castShadow = true;
        trunk.receiveShadow = true;
        
        // Attach user data to tree main group for referencing
        trunk.userData = { 
            type: 'tree_trunk_base', 
            id: i, 
            platformCenter: new THREE.Vector3(trunk.position.x, trunk.position.y + 8, trunk.position.z),
            branches: [],
            rootGroup: new THREE.Group()
        };

        // Brancah Logic (Simplified recursive generation)
        generateBranchHierarchy(trunk, 0);

        treeGroup.add(trunk);
        trees.push({ root: trunk }); 
    }
    
    scene.add(treeGroup);
}

function generateBranchHierarchy(parentMesh, depth) {
    if(depth > 3) return;
    
    // Chance to grow a branch
    if(Math.random() > 0.7) {
        const geo = new THREE.CylinderGeometry(0.5, 2, 8 + Math.random()*5, 6);
        const matLeaf = getLeavesMaterial();
        
        // Random angle and rotation
        const yRot = (Math.random() - 0.5) * 1.5;
        const xRot = Math.PI / 4 - Math.random() * Math.PI/2;
        
        const branch = new THREE.Mesh(geo, matBark);
        
        // Random offset from top of parent
        const heightOffset = depth * 3 + 1;
        branch.position.set(Math.random()-0.5, -heightOffset, Math.random()-0.5);
        
        branch.rotation.y = yRot + (Math.PI/2); // Point outward
        branch.rotation.x = xRot;

        scene.add(branch); 
        if(!parentMesh.userData.branches) parentMesh.userData.branches = [];
        parentMesh.userData.branches.push(branch);
        
        // Canopies at ends of major branches
        if(depth > 0) {
            const canopyGeo = new THREE.SphereGeometry(3 + Math.random()*2, 12, 8);
            const canopy = new THREE.Mesh(canopyGeo, getLeavesMaterial());
            canopy.position.set(Math.sin(yRot)*4, depth*3+1 - heightOffset, Math.cos(yRot)*4); // Simplified calc
            canopy.userData = { swaySpeed: Math.random(), swayAmplitude: 0.2, basePos: canopy.position.clone(), idHash: canopy.id };
            
            // Find world pos relative to tree base for animation later
            canopy.updateMatrixWorld(true);
            const pos = new THREE.Vector3().setFromMatrixPosition(canopy.matrixWorld);
            branch.userData.canopyMeshes = branch.userData.canopyMeshes || [];
            branch.userData.canopyMeshes.push({mesh: canopy, localOffset: pos}); // Store relative

            // We stick it to the scene for performance (no parent constraint needed if we animate in loop)
            // BUT sticking to group is safer for coordinate transforms during reset. 
            // Let's put it inside a temporary tree container logic later, or just keep track manually here.
            
            branch.add(canopy);
        }

        generateBranchHierarchy(branch, depth+1);
    }
}

function generateGround() {
    // Infinite-feeling plane with noise
    const w = 400;
    const h = 400;
    const detail = 64;
    
    const geo = new THREE.PlaneGeometry(w, h, detail, detail);
    const vertices = geo.attributes.position.array;
    
    for (let i = 0; i < vertices.length; i += 3) {
        // Simple pseudo-random bump function
        const x = vertices[i];
        const z = vertices[i+2];
        
        // Base flatness + noise
        let y = Math.sin(x * 0.05) * 2;
        y += Math.cos(z * 0.05) * 2;
        y += (Math.random() - 0.5) * 1.5; // Small bumps
        
        vertices[i+1] = y;
    }
    
    // Vertex colors for variation
    const colors = [];
    for(let i=0; i<vertices.length/3; i++) {
        const c = new THREE.Color('#795548').lerp(new THREE.Color('#4caf50'), Math.random()*0.5 + 0.5);
        colors.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    
    const mat = new THREE.MeshLambertMaterial({ vertexColors: true, map: textures.grass });
    const floor = new THREE.Mesh(geo, mat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    floor.userData.type = 'floor'; // Custom tag
    scene.add(floor);
    
    // Add some static trees in background to frame it
    const bgTreeGeo = new THREE.CylinderGeometry(1, 1.5, 3 + Math.random()*3, 8);
    for(let i=0; i<500; i++) {
        const t = new THREE.Mesh(bgTreeGeo, matBark);
        t.position.x = (Math.random()-0.5)*w*2;
        t.position.z = (Math.random()-0.5)*h*2 + 40; // Back of camera mostly
        t.position.y = Math.random() * 10;
        scene.add(t);
    }
}

function generateVillage() {
    const dwellingCount = CONFIG.dwellings;
    
    // Find valid spots on trees where we can place platforms
    const candidates = [];
    
    trees.forEach(tree => {
        // Base platform near bottom of canopy? Or distinct per tree.
        // Let's define a "hub" zone for this tree.
        
        // 1. Central Log Platform (on trunk)
        const cx = tree.root.position.x;
        const cy = tree.root.position.y + (tree.root.geometry.parameters.height * 0.2); 
        const cz = tree.root.position.z;
        
        candidates.push({x: cx, y: cy+5, z: cz + Math.random() * 10}); // Higher up
        candidates.push({x: cx, y: cy, z: cz}); // Trunk level
        
        // Random spots on branches for hanging platforms
        if(tree.root.userData.branches) {
            tree.root.userData.branches.forEach(branch => {
                branch.updateMatrixWorld();
                const center = new THREE.Vector3().setFromMatrixPosition(branch.matrixWorld);
                candidates.push({x: center.x, y: center.y + 1, z: center.z}); // Hang from branches
            });
        }
    });

    let placed = 0;

    // Dwellings
    for(let i=0; i<dwellingCount && placed < candidates.length; i++) {
        const c = candidates[Math.floor(Math.random() * candidates.length)];
        createBuilding(c.x, c.y, c.z);
        
        if(placed === 0 || (Math.random()>0.6)) {
            // Try to connect to another random building or tree if it's an edge case? 
            // For simplicity, just place randomly. Bridges connect later in the loop logic conceptually.
        }
        placed++;
    }

    // Connect Components with Bridges
    createBridges();
}

function createBuilding(x, y, z) {
    // Procedural Building Group
    const group = new THREE.Group();
    group.position.set(x,y,z);
    
    const sizeX = 4 + Math.random()*2;
    const sizeZ = 4 + Math.random()*2;
    const hScale = 0.8 + Math.random()*0.4;

    // Floor Platform
    const floorGeo = new THREE.PlaneGeometry(sizeX, sizeZ);
    floorGeo.rotateX(-Math.PI/2);
    
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x8D6E63 });
    const platform = new THREE.Mesh(floorGeo, floorMat);
    platform.receiveShadow = true;
    platform.castShadow = true;
    group.add(platform);
    
    // Walls (Procedural based on size)
    const wallH = 1.5 * hScale;
    const halfWalls = [
        {w: 0, h: Math.PI/2}, // Front
        {w: Math.PI/2, l: 0}, // Side
        {w: Math.PI, l: Math.PI}
    ];

    halfWalls.forEach(ortho => {
        const geo = new THREE.PlaneGeometry(sizeX, wallH);
        const mat = new THREE.MeshStandardMaterial({ color: 0x6D4C41 });
        
        // Cutout for door/window? Too complex for single file procedural. Just flat walls with detail texture later.
        const w = new THREE.Mesh(geo, mat);
        w.rotation.y = ortho.w;
        
        // Offset to corner
        const ox = (Math.cos(ortho.w)*sizeX/2);
        const oz = (Math.sin(ortho.w)*sizeZ/2);

        w.position.set(ox, wallH/2, oz);
        if(ortho.l) w.rotation.z = Math.PI/2; // Rotate side
        
        group.add(w);
    });

    // Roof
    const roofGeo = new THREE.ConeGeometry(Math.max(sizeX, sizeZ)*0.8, 3, 4);
    roofGeo.rotateY(-Math.PI/4);
    roofGeo.rotateX(0); 
    roofGeo.scale(sizeX/Math.sqrt(2), 1, sizeZ/Math.sqrt(2)); // Square fit
    
    // Actually use a pyramid for wood look
    const pGeo = new THREE.ConeGeometry(sizeX/1.5 + Math.random()*0.5, wallH*2, 4);
    pGeo.rotateY(Math.PI/4);
    
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x9E8C73, roughness: 0.9 });
    const roof = new THREE.Mesh(pGeo, roofMat);
    roof.position.y = group.scale.y * wallH + roof.height/2; // Approx
    roof.castShadow = true;
    
    group.add(roof);

    // Details (Lantern)
    if(Math.random() > 0.5) {
        const lGeo = new THREE.SphereGeometry(0.3, 8, 8);
        const lMat = new THREE.MeshStandardMaterial({ emissive: 0xffaa00, emissiveIntensity: 2 });
        const lantern = new THREE.Mesh(lGeo, lMat);
        lantern.position.set(Math.random()>0.5?sizeX/2:-sizeX/2, wallH + 1, z+sizeZ/2);
        group.add(lantern);
        
        // Light source
        const light = new THREE.PointLight(0xffaa00, 5, 8);
        light.position.copy(lantern.position);
        group.add(light);
    }

    // Door
    if(Math.random() > 0.3) {
        const doorGeo = new THREE.PlaneGeometry(1, 2);
        const doorMat = new THREE.MeshStandardMaterial({color: 0x3e2723});
        const d = new THREE.Mesh(doorGeo, doorMat);
        d.position.set(0, 1.2, sizeZ/2 + 0.1); // Front face slightly forward
        d.rotation.y = -Math.PI/2; // Face out? No, we used y=PI/2 for side. Let's align with platform.
        // Adjust based on rotation of group/platform... simplifying: facing 'front' of world logic is hard in procedural.
        // Let's just stick it to the center front.
    }

    scene.add(group);
    
    // Tag for collision detection
    group.userData = { type: 'building', platform: platform, id: `b-${group.id}` };
    
    // Randomly push villager onto roof if space permits (rare)
}

function createBridges() {
    const bridgeCount = 8;
    
    for(let i=0; i<bridgeCount; i++) {
        const t1 = trees[Math.floor(Math.random()*trees.length)];
        const t2 = trees[Math.floor(Math.random()*trees.length)];
        
        let p1, p2;
        
        // Get valid point on tree 1
        if(t1.root.userData.branch) {
             // Use branch tip
        } else {
            // Trunk top
            p1 = t1.root.position.clone();
            p1.y += t1.root.geometry.parameters.height * 0.5;
        }

        // Get valid point on tree 2
        p2 = t2.root.position.clone();
        p2.y += t2.root.geometry.parameters.height * 0.4;

        // Distance check
        if(p1.distanceTo(p2) > 30) { i--; continue; } // Too far, retry
        
        createCurveBridge(p1, p2);
    }
}

function createCurveBridge(start, end) {
    const points = [];
    points.push(start);
    
    // Mid point
    const mid = new THREE.Vector3().lerpVectors(start, end, 0.5).add(new THREE.Vector3(0, -2 + Math.random()*-3, 0)); // Sag
    const heightOffset = 5;
    points.push(mid);
    
    points.push(end);

    const curve = new THREE.CatmullRomCurve3(points);
    
    // Ropes (top)
    const ropeMat = new THREE.LineBasicMaterial({ color: 0x3e2723, linewidth: 5 });
    const ropeGeometry = new THREE.BufferGeometry().setFromPoints([points[0], points[1], points[2]]);
    const ropeTop = new THREE.LineSegments(ropeGeometry, ropeMat);
    
    // Planks (bottom)
    const plankGeo = new THREE.BoxGeometry(1.5, 0.4, 0.8);
    const nPlanks = Math.floor(curve.getLength()/2.5);
    const planksGroup = new THREE.Group();
    
    for(let i=0; i<nPlanks; i++) {
        // Rotate plank to face curve tangent?
        // Easier: Place along curve, rotate slightly towards end point for perspective
        
        const pos = curve.getPoint(i/nPlanks);
        const nextPos = curve.getPoint(Math.min(1, (i+0.1)/nPlanks));
        
        const plank = new THREE.Mesh(plankGeo, matWood);
        plank.position.copy(pos);
        plank.lookAt(nextPos); // Look at next point for rotation
        
        // Slight randomness in placement so they don't look perfectly aligned
        plank.rotation.x += (Math.random()-0.5)*0.1;

        planksGroup.add(plank);
    }
    
    scene.add(ropeTop);
    scene.add(planksGroup);
    
    return { ropeTop, planksGroup };
}

function spawnVillager() {
    // Just pick a random point on ground or bridge initially, but let's stick to ground for now + bridges.
    const group = new THREE.Group();
    
    // Body
    const bodyColor = Math.random() > 0.8 ? '#3e2723' : '#5d4037';
    const headColor = '#ffccbc';

    const bodyGeo = new THREE.CylinderGeometry(0.3, 0.4, 1.2);
    const headGeo = new THREE.SphereGeometry(0.3);
    
    const matBody = new THREE.MeshStandardMaterial({ color: bodyColor });
    const matHead = new THREE.MeshStandardMaterial({ color: headColor });

    const body = new THREE.Mesh(bodyGeo, matBody);
    body.position.y = 0.6;
    const head = new THREE.Mesh(headGeo, matHead);
    head.position.y = 1.4;
    
    group.add(body);
    group.add(head);
    
    group.position.set(
        (Math.random()-0.5)*200, 
        10 + Math.random()*10, 
        (Math.random()-0.5)*200
    );
    
    // Random Target
    const target = new THREE.Vector3(
        (Math.random()-0.5)*200,
        10,
        (Math.random()-0.5)*200
    );

    scene.add(group);
    villagers.push({ mesh: group, target: target });
}

let lastTime = 0;

function animate(time) {
    requestAnimationFrame(animate);
    
    const dt = Math.min(clock.getDelta(), 0.1);
    const elapsedTime = time * 0.001;

    updateFps(dt);
    updateEnvironment();
    updateVillagers(dt, time);
    updateSway(time); // Tree swaying logic

    controls.update();

    renderer.render(scene, camera);
}

function updateFps(dt) {
    if(!lastTime) lastTime = Date.now();
    const fps = Math.floor(1 / dt);
    document.getElementById('fps-counter').innerText = `FPS: ${fps}`;
    // Smooth UI (optional)
    lastTime = Date.now();
}

function updateEnvironment() {
    // Sun Position based on Time of Day
    const hour = CONFIG.time;
    let angle = 0;
    
    if(hour < 12) {
        angle = (hour / 12) * Math.PI - Math.PI/2; // Rise from East
    } else {
        angle = ((hour-6)/18) * Math.PI - Math.PI/2 + 0.1; 
        // Correction to ensure it sets in West
        if(CONFIG.season === 'winter') angle -= 0.2;
    }

    const sunPos = new THREE.Vector3(Math.sin(angle)*100, Math.cos(angle)*40, Math.sin(angle)*50);
    directionLight.position.copy(sunPos);
    
    // Sky Color
    if(CONFIG.season === 'winter') {
        scene.background = new THREE.Color().setHSL(0.6, 0.1, 0.8).lerp(new THREE.Color(0x222), (hour-6)/18);
    } else {
        scene.background = new THREE.Color().setHSL(0.58 + Math.sin(angle)*0.1, 0.7, 0.9).lerp(new THREE.Color(0x111), hour/24);
    }

    // Atmosphere
    scene.fog.density = CONFIG.fogDensity;
    
    // Light intensity/color shift
    const isDay = Math.cos(angle) > -0.2;
    directionLight.intensity = isDay ? 1.5 : 0;
    lightAmpel.intensity = isDay ? 0.2 : 1.0;
    
    // Lanterns glow at night dynamically via uniforms or scale? 
    // Simpler: Change material emissive in loop if easy, but dynamic lights are better.
}

function updateSway(time) {
    const t = time * 0.5 + Math.random() * (Math.PI*2);
    

    // Animate Leaves/Canopies attached to groups manually
    scene.traverse((obj) => {
        if(obj.userData && obj.userData.swaySpeed) {
            obj.position.y = obj.userData.basePos.y + Math.sin(time * obj.userData.swaySpeed + 100 + obj.idHash) * CONFIG.wind;
        }
    });

    // Animate Tree Trunks (Bark movement - subtle) -- omitted for stability, too computationally heavy to move mesh points in loop
    
    // Swing Bridges
    const bridges = scene.getObjectByName('bridge_group'); // Wait, I added individual meshes to scene. Need grouping or iteration.
    // Re-scanning approach:
    
    scene.traverse((obj) => {
        if(!obj.geometry) return;
        if(obj.geometry.type === 'BufferGeometry' && obj.material?.type === 'MeshStandardMaterial') return; // Skip geometry
    
        if(obj.isGroup || (obj.userData.swayFactor)) {
             // Simple sway for planks
             if(obj.name === 'BridgePlank' || (obj.userData.type === 'bridge_part')) {
                 obj.rotation.z = Math.sin(time * 2) * 0.05 * CONFIG.wind;
                 obj.rotation.x = Math.cos(time * 1.5) * 0.05 * CONFIG.wind;
             }
        }
    });
}

function updateVillagers(dt, time) {
    villagers.forEach(v => {
        const dir = new THREE.Vector3().subVectors(v.target, v.mesh.position);
        const dist = dir.length();
        
        if(dist < 0.5) {
            // Pick new target
            v.target.set((Math.random()-0.5)*200, 10 + Math.random()*10, (Math.random()-0.5)*200);
        } else {
            dir.normalize();
            
            // Gravity check for movement? 
            // We are in orbit mode mostly, but if walking...
            // Simple walk animation (sine wave y)
            v.mesh.position.add(dir.multiplyScalar(walkSpeed * dt));
            v.mesh.position.y += Math.sin(time*5)*0.2; // Bobbing
        }
    });
}
